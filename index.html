<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
                <title>半田赤レンガ トロッコクイズ</title>
                <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="app" class="app-container">
            
            <!-- ① タイトル画面 -->
            <section id="title-screen" class="screen active title-screen">
                <div class="sub-badge">カブトビール輸送ミッション</div>
                <h1 class="main-title">半田赤レンガ<br>トロッコクイズ</h1>
                <p class="title-desc">
                スマホを横向きにして左右に傾け、トロッコを操作しよう！<br>
                赤レンガの謎を解きながら、半田駅までビールを守り抜けるかな？
                </p>
                <button id="start-btn" class="start-btn">スタート</button>
                <p class="orient-note">※スマートフォンは「横向き」でのプレイがおすすめです</p>
            </section>
            
            <!-- ② 地図誘導画面（各問題の選択肢が出る前に表示） -->
            <section id="map-screen" class="screen map-screen">
                <div class="top-bar">
                    <span id="map-q-badge" class="q-badge">第1問 / 全5問</span>
                    <span id="map-beer-status" class="beer-badge">🍺 残量：満タン</span>
                </div>
                
                <div class="map-content">
                    <h2 id="map-q-heading" class="map-heading">現地スポットへ向かおう！</h2>
                    <p id="map-hint-text" class="map-hint-text"></p>
                    
                    <div class="map-actions">
                        <button id="show-map-btn" class="map-open-btn" type="button">🗺️ 地図を表示する</button>
                        <button id="arrived-btn" class="arrived-btn" type="button">📍 目的地へ着いた！</button>
                    </div>
                    
                    <!-- 地図表示エリア（ボタンを押すと展開） -->
                    <div id="map-embed-box" class="map-embed-box hidden">
                        <div class="map-embed-header">
                            <span>半田赤レンガ建物 周辺マップ</span>
                            <a id="external-map-link" href="https://www.google.com/maps/search/?api=1&query=半田赤レンガ建物" target="_blank" rel="noopener noreferrer">大きな地図で開く ↗</a>
                        </div>
                        <iframe
                            id="map-iframe"
                            src="https://www.openstreetmap.org/export/embed.html?bbox=136.925%2C34.888%2C136.942%2C34.898&layer=mapnik&marker=34.8933%2C136.9336"
                            loading="lazy"
                            referrerpolicy="no-referrer-when-downgrade">
                        </iframe>
                    </div>
                </div>
            </section>
            
            <!-- ③ ゲーム画面（横向きトロッコ選択） -->
            <section id="game-screen" class="screen game-screen">
                <!-- 上部：問題番号・制限時間バー・ミス数 -->
                <div class="game-top">
                    <span id="game-q-badge" class="q-badge">Q1.</span>
                    <div class="timer-track">
                        <div id="timer-bar" class="timer-bar"></div>
                    </div>
                    <span id="miss-counter" class="miss-counter">ミス: 0回</span>
                </div>
                
                <!-- 問題文カード -->
                <div class="question-banner">
                    <p id="question-text"></p>
                </div>
                
                <!-- 中央：左選択肢・トロッコ・右選択肢 -->
                <div class="arena-row">
                    <!-- 左選択肢＋円形ゲージ -->
                    <div id="choice-left-box" class="choice-box" data-side="left">
                        <div class="ring-wrap">
                            <svg class="progress-ring" viewBox="0 0 64 64">
                                <circle class="ring-bg" cx="32" cy="32" r="26"></circle>
                                <circle id="ring-left" class="ring-fill" cx="32" cy="32" r="26"></circle>
                            </svg>
                            <span class="dir-arrow">←</span>
                        </div>
                        <div id="choice-left-text" class="choice-label">選択肢A</div>
                    </div>
                    
                    <!-- 中央トロッコ -->
                    <div class="cart-stage">
                        <div id="cart-wrapper" class="cart-wrapper">
                            <img id="cart-img" src="minecart_3.png" alt="カブトビールを積んだトロッコ" class="cart-img">
                                <div id="cart-fallback" class="cart-fallback hidden">
                                    <div id="fallback-beers" class="fallback-beers">🍺🍺🍺</div>
                                    <div class="fallback-cart">🛒トロッコ</div>
                                </div>
                        </div>
                        
                        <!-- 正解〇 / 不正解× オーバーレイ -->
                        <div id="judge-mark" class="judge-mark hidden">
                            <div id="judge-symbol" class="judge-symbol">〇</div>
                            <div id="judge-subtext" class="judge-subtext">正解！</div>
                        </div>
                    </div>
                    
                    <!-- 右選択肢＋円形ゲージ -->
                    <div id="choice-right-box" class="choice-box" data-side="right">
                        <div class="ring-wrap">
                            <svg class="progress-ring" viewBox="0 0 64 64">
                                <circle class="ring-bg" cx="32" cy="32" r="26"></circle>
                                <circle id="ring-right" class="ring-fill" cx="32" cy="32" r="26"></circle>
                            </svg>
                            <span class="dir-arrow">→</span>
                        </div>
                        <div id="choice-right-text" class="choice-label">選択肢B</div>
                    </div>
                </div>
                
                <!-- 下部：ガイド＆手動補助ボタン -->
                <div class="game-bottom">
                    <p id="tilt-guide" class="tilt-guide">スマホを左右に傾けてトロッコを操作しよう！（PCやセンサーOFF時はボタン／← →キーでも操作可）</p>
                    <div class="fallback-controls">
                        <button id="hold-left-btn" class="mini-btn" type="button">◀ 左に傾ける</button>
                        <button id="enable-sensor-btn" class="mini-btn sensor-btn hidden" type="button">傾きセンサーを有効化</button>
                        <button id="hold-right-btn" class="mini-btn" type="button">右に傾ける ▶</button>
                    </div>
                </div>
                
                <!-- 解説モーダル（1問ごとの回答後） -->
                <div id="explain-overlay" class="explain-overlay hidden">
                    <div class="explain-card">
                        <h3 id="explain-result-title">正解！</h3>
                        <p id="explain-body"></p>
                        <button id="next-question-btn" class="next-btn" type="button">次の問題へ</button>
                    </div>
                </div>
            </section>
            
            <!-- ④ リザルト画面 -->
            <section id="result-screen" class="screen result-screen">
                <div class="sub-badge">ゴール判定</div>
                <h1 id="result-title" class="result-title">半田駅に到着！</h1>
                <div id="result-beer-visual" class="result-beer-visual"></div>
                <p id="result-summary" class="result-summary"></p>
                <div class="result-actions">
                    <button id="retry-btn" class="start-btn" type="button">リトライ</button>
                    <button id="back-title-btn" class="secondary-btn" type="button">タイトル画面へ戻る</button>
                </div>
            </section>
            
        </div>
        
        <script src="script.js"></script>
    </body>
</html>
